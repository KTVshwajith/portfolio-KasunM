# Builds and deploys the portfolio to GitHub Pages:
#   /            -> portfolio (index.html, images)
#   /gymbuddy/   -> GymBuddy web app (pre-built)
#   /learn/      -> CyberLearn Lab (Astro, built here)
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cyberlearn/package-lock.json

      - name: Build CyberLearn Lab
        working-directory: cyberlearn
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          tar --exclude=./.git --exclude=./.github --exclude=./cyberlearn --exclude=./_site -cf - . | tar -xf - -C _site
          cp -r cyberlearn/dist _site/learn

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
